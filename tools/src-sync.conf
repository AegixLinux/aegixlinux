# aegix-src-sync configuration
# Format: <live_src_path>  <aegix_submodule_path>
# Paths may use ~ for the user home dir.
# Lines starting with # and blank lines are ignored.

~/.local/src/dwm           ~/code/PROJECTS/AEGIX/dwm
~/.local/src/st            ~/code/PROJECTS/AEGIX/st
~/.local/src/dmenu         ~/code/PROJECTS/AEGIX/dmenu
~/.local/src/dwmblocks     ~/code/PROJECTS/AEGIX/dwmblocks

# Gate-only repos: public, pushed by hand, but not synced to a submodule.
#gate-extra ~/.local/src/tabbed
